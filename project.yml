# XcodeGen spec. Run `xcodegen` in this folder to (re)create BreedFinder.xcodeproj.
# Edit settings here, not in Xcode: regenerating overwrites changes made in Xcode.
name: BreedFinder

options:
  bundleIdPrefix: com.bryanbee
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Your Apple Developer Team ID (developer.apple.com/account -> Membership details).
    DEVELOPMENT_TEAM: "35ADT9U8CX"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"     # the version shown on the App Store
    CURRENT_PROJECT_VERSION: "2"   # bump for every upload to App Store Connect

packages:
  # Anonymous usage stats (BreedFinder/Support/Analytics.swift). "from" allows any 2.x
  # update but not 3.0, a new major version (still in beta as of November 2026).
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: "2.14.2"

targets:
  BreedFinder:
    type: application
    platform: iOS
    sources:
      - path: BreedFinder
      # Generated by ml/convert_model.py. Core ML models are compiled like source
      # code, and Xcode generates the DogBreedClassifier Swift class from it.
      - path: MLModels/DogBreedClassifier.mlpackage
        buildPhase: sources
      # Breed profiles (built by tools/build_breed_content.py) and reference photos.
      - path: Resources/breeds.json
      - path: Resources/BreedPhotos
        type: folder  # keeps the BreedPhotos/ subfolder inside the app bundle
    dependencies:
      - package: TelemetryDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryanbee.breedfinder
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only, so no iPad screenshots needed
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Breed Finder
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: "Breed Finder records a 5-second video of a dog to guess its breed. The video is analyzed on your iPhone and is never uploaded."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The app uses no encryption of its own. Declaring that here skips the
        # export-compliance question on every upload.
        ITSAppUsesNonExemptEncryption: false
    scheme:
      testTargets:
        - BreedFinderTests

  BreedFinderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BreedFinderTests
    dependencies:
      - target: BreedFinder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bryanbee.breedfinder.tests
